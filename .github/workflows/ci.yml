name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Testar scripts PowerShell
        shell: pwsh
        run: Invoke-Pester -Path ./scripts/tests -CI

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/GameLife.Web/package-lock.json

      - name: Instalar frontend
        working-directory: src/GameLife.Web
        run: npm ci

      - name: Testar frontend
        working-directory: src/GameLife.Web
        run: npm test

      - name: Compilar frontend
        working-directory: src/GameLife.Web
        run: npm run build

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar solução
        run: dotnet restore GameLife.slnx

      - name: Testar solução
        run: dotnet test GameLife.slnx --configuration Release --no-restore

      - name: Publicar desktop
        run: dotnet publish src/GameLife.Desktop/GameLife.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/GameLife

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Obter histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Examinar segredos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
